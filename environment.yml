name: bdt_env
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - numpy
  - scipy
  - scikit-learn
  - matplotlib
  - pandas
  - tqdm
  - pip
  - pip:
    - transformers
    - accelerate
    - bitsandbytes  # Critical for running models with less VRAM
    - python-dotenv # For managing secrets if needed
    - ipykernel     # For running notebooks